name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL_VERSION: 2.30.9

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache SDL2 source
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: android/SDL
          key: sdl2-${{ env.SDL_VERSION }}

      - name: Download SDL2
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" | tar xz
          mv "SDL2-${SDL_VERSION}" android/SDL

      - name: Add SDL's Java glue
        run: |
          # SDL ships its own sample Gradle project with a wrapper jar we don't use
          rm -rf android/SDL/android-project/gradle android/SDL/android-project/gradlew*
          mkdir -p android/app/src/main/java/org/libsdl
          cp -r android/SDL/android-project/app/src/main/java/org/libsdl/app android/app/src/main/java/org/libsdl/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      - name: Build APK
        working-directory: android
        run: |
          NDK_ARG=""
          if [ -n "$ANDROID_NDK_LATEST_HOME" ]; then NDK_ARG="-PndkVersion=$(basename "$ANDROID_NDK_LATEST_HOME")"; fi
          echo "NDK: $NDK_ARG"
          set -o pipefail
          gradle assembleRelease --no-daemon $NDK_ARG -PversionCode=${{ github.run_number }} 2>&1 | tee ../build.log

      # Surface the important part of a failed build as annotations (readable without log access)
      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          { grep -E "error:|error :|undefined reference|CMake Error|FAILED" build.log | head -n 60;
            grep -A 10 "What went wrong" build.log | head -n 40; } > errors.txt || true
          split -l 12 errors.txt part_
          for f in part_*; do
            msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=build::${msg}"
          done
          echo "::error title=tail::$(tail -n 25 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk OpenDesperados.apk
          ls -la OpenDesperados.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDesperados-build-${{ github.run_number }}
          path: OpenDesperados.apk

      # A single "latest" release that always holds the newest APK: easy to open on the phone.
      - name: Publish latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest OpenDesperados.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}. Install OpenDesperados.apk on your phone. The game data is NOT included: copy your own Desperados folder to the phone's internal storage as /Desperados."
