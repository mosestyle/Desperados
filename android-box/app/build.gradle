plugins {
    id 'com.android.application'
}

def sdlDir = "${rootDir}/SDL"

android {
    // A separate app: installs next to the rebuilt-engine version instead of replacing it.
    namespace 'com.mosestyle.desperados.original'
    compileSdk 34
    if (project.hasProperty('ndkVersion')) {
        ndkVersion project.property('ndkVersion')
    }

    defaultConfig {
        applicationId 'com.mosestyle.desperados.original'
        minSdk 26
        targetSdk 34
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName "0.0.${project.findProperty('versionCode') ?: '0'}"
        ndk {
            abiFilters 'arm64-v8a'   // Box64 runs on 64-bit ARM only
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DSDL2_SOURCE_DIR=${sdlDir}", "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    signingConfigs {
        shared {
            storeFile file('../../android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    // libbox64.so is loaded with dlopen at run time: keep the libraries as plain files on disk
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/libbox64.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
